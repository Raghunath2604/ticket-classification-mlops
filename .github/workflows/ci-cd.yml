name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly drift check against the latest production data snapshot.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ghcr.io/${{ github.repository }}/ticket-classifier

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - run: pip install ruff
      - run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install torch (CPU-only — avoids pulling the CUDA build)
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
      - run: pip install -r requirements-dev.txt
      - name: Run unit tests (fast, offline, mocked model)
        run: pytest tests/ -v
      - name: Pipeline smoke test (offline model, proves training wiring works)
        run: python -m src.train --offline --epochs 1

  train-and-evaluate:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install torch (CPU-only — avoids pulling the CUDA build)
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
      - run: pip install -r requirements.txt
      - name: Generate training data
        run: python src/generate_data.py
      - name: Fine-tune on the real base model
        run: python -m src.train --model-name distilbert-base-uncased --epochs 3
      - name: Evaluate — fails the build if quality regresses
        run: python -m src.evaluate --model-path artifacts/model --data data/tickets_train.csv --min-accuracy 0.80
      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: artifacts/model

  docker-build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [train-and-evaluate]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: artifacts/model
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ec2:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker-build-and-push]
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker stop ticket-classifier-api || true
            docker rm ticket-classifier-api || true
            docker run -d --name ticket-classifier-api \
              --restart unless-stopped \
              -p 8000:8000 \
              ${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker image prune -f

  drift-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install torch (CPU-only — avoids pulling the CUDA build)
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
      - run: pip install -r requirements.txt
      - name: Generate reference/current data
        # In production this step is replaced by pulling the last N days
        # of real inference logs instead of regenerating synthetic data.
        run: python src/generate_data.py
      - name: Run drift check
        run: |
          python -m src.drift_monitor \
            --reference data/tickets_reference.csv \
            --current data/tickets_current.csv \
            --out-dir artifacts/drift_report \
            --fail-above 0.5
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: artifacts/drift_report
